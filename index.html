<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>

<body class="main-layout" onload="onInit()" onresize="onResize()">

    <header class="main-header flex full">
        <img class="logo" src="img/logo.png">

        <nav class="flex">
            <button class="close-menu-btn" onclick="toggleMenu()">✖</button>
            <a href="#" onclick="openSavedGallery(), toggleMenu()">Saved</a>
            <a href="#" onclick="onRandomMeme()">Random</a>
            <a href="index.html" onclick="toggleMenu()">Gallery</a>
        </nav>

        <button class="open-menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <section class="main-gallery gallery"></section>

    <section class="editor hidden">
        <div class="canvas-container">
            <canvas width="400" height="400" onmousedown="onDown(event)"></canvas>
        </div>

        <div class="edit-container">
            <input type="text" placeholder="Write here" oninput="onSetTxt(this)">

            <div class="line-btns">
                <button onclick="onAddLine()">
                    <img src="img/plus.png">
                </button>

                <button onclick="onDeleteLine()">
                    <img src="img/delete.png">
                </button>

                <button onclick="onMoveLine(this)" data-dir="up">
                    <img src="img/up.png">
                </button>

                <button onclick="onMoveLine(this)" data-dir="down">
                    <img src="img/down.png">
                </button>

                <button onclick="onAlignLine(this)" data-dir="left">
                    <img src="img/align-left.png">
                </button>

                <button onclick="onAlignLine(this)" data-dir="center">
                    <img src="img/align-center.png">
                </button>

                <button onclick="onAlignLine(this)" data-dir="right">
                    <img src="img/align-right.png">
                </button>
            </div>

            <div class="txt-btns flex">
                <button>
                    <label for="color">
                        <img class="color-picker" src="img/color-picker.png">
                    </label>
                </button>
                <input class="hidden" type="color" id="color" value="#ffffff" onchange="onSetColor(this)">

                <button onclick="onSetSize(this)" value="bigger">
                    <img src="img/size-up.png">
                </button>

                <button onclick="onSetSize(this)" value="smaller">
                    <img src="img/size-down.png">
                </button>

                <select onchange="onSetFont(this)">
                    <option>Arial</option>
                    <option>Courier New</option>
                    <option>Garamond</option>
                    <option>Georgia</option>
                    <option>Helvetica</option>
                    <option selected>Impact</option>
                    <option>Lucida Console</option>
                    <option>Tahoma</option>
                    <option>Times New Roman</option>
                    <option>Trebuchet MS</option>
                    <option>Verdana</option>
                    <option></option>
                </select>
            </div>

            <div class="emojis flex">
                <p onclick="onSetEmoji(this)">😂</p>
                <p onclick="onSetEmoji(this)">💩</p>
                <p onclick="onSetEmoji(this)">😫</p>
                <p onclick="onSetEmoji(this)">🥵</p>
                <p onclick="onSetEmoji(this)">🤡</p>
            </div>

            <div class="export flex">
                <form method="POST" enctype="multipart/form-data" onsubmit="onShareImg(event)">
                    <button class="btn" type="submit">Share to facebook</button>
                </form>

                <button class="btn" onclick="onSaveMeme()">Save picture</button>

                <a href="#" onclick="onDownloadMeme(this)" download="file-name">Download</a>
            </div>
        </div>
    </section>


    <section class="saved-gallery gallery hidden"></section>

    <script src="js/main.js"></script>
    <script src="js/services/utils.service.js"></script>
    <script src="js/services/storage.service.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/services/gallery.service.js"></script>
    <script src="js/services/saved.service.js"></script>
    <script src="js/controllers/meme.controller.js"></script>
    <script src="js/controllers/gallery.controller.js"></script>
    <script src="js/controllers/saved.controller.js"></script>
</body>

</html>
