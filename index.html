<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body onload="onInit()" onresize="onResize()">

    <header>
        <h1>Meme generator</h1>
    </header>

    <section class="gallery"></section>

    <section class="editor hidden">
        <canvas width="400" height="400" onmousedown="onDown(event)"></canvas>

        <div class="input-container">
            <label>
                Text:
                <input type="text" oninput="onSetTxt(this)">
            </label>

            <input type="color" value="#ffffff" onchange="onSetColor(this)">

            <button onclick="onSetSize(this)" value="5">+</button>
            <button onclick="onSetSize(this)" value="-5">-</button>

            <button onclick="onAddLine()">Add line</button>
            <button onclick="onSwitchLine()">Switch line</button>

            <a href="#" onclick="onDownloadMeme(this)" download="file-name">Download</a>
        </div>
    </section>

    <footer></footer>

    <script src="js/main.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/services/gallery.service.js"></script>
    <script src="js/controllers/meme.controller.js"></script>
    <script src="js/controllers/gallery.controller.js"></script>
</body>

</html>
