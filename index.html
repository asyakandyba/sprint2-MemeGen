<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body onload="onInit()" onresize="onResize()" class="main-layout">

    <header class="main-header flex full">
        <img class="logo" src="img/logo.png">

        <nav>
            <a href="index.html">Gallery</a>
            <a href="#">Saved</a>
        </nav>
    </header>

    <section class="gallery"></section>

    <section class="editor flex hidden">
        <div class="canvas-container">
            <canvas width="400" height="400" onmousedown="onDown(event)"></canvas>
        </div>

        <div class="edit-container">
            <input type="text" placeholder="Write here" oninput="onSetTxt(this)">

            <div class="line-btns">
                <button onclick="onAddLine()">Add line</button>
            </div>

            <div class="txt-btns">
                <input type="color" value="#ffffff" onchange="onSetColor(this)">
                <button onclick="onSetSize(this)" value="5">+</button>
                <button onclick="onSetSize(this)" value="-5">-</button>
            </div>

            <a href="#" onclick="onDownloadMeme(this)" download="file-name">Download</a>
        </div>
    </section>

    <footer></footer>

    <script src="js/services/meme.service.js"></script>
    <script src="js/services/gallery.service.js"></script>
    <script src="js/controllers/meme.controller.js"></script>
    <script src="js/controllers/gallery.controller.js"></script>
</body>

</html>
